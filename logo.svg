<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" role="img" aria-labelledby="title desc">
  <title id="title">offsiteiq</title>
  <desc id="desc">Three origin nodes connected by routes converging on a ring-shaped destination, beside the offsiteiq wordmark.</desc>
  <g fill="none" stroke-linecap="round">
    <!-- routes from origins to destination -->
    <path d="M14 18 Q28 22 34 34" stroke="#3978F6" stroke-width="4"/>
    <path d="M14 62 Q28 58 34 48" stroke="#805AD5" stroke-width="4"/>
    <path d="M66 14 Q58 26 50 32" stroke="#19A88C" stroke-width="4"/>
    <!-- destination ring with tail (reads as a "q" / pin) -->
    <circle cx="42" cy="41" r="10" stroke="#172A46" stroke-width="6"/>
    <path d="M52 41 V66" stroke="#172A46" stroke-width="6"/>
  </g>
  <!-- origin nodes -->
  <circle cx="12" cy="17" r="6" fill="#3978F6"/>
  <circle cx="12" cy="63" r="6" fill="#805AD5"/>
  <circle cx="68" cy="12" r="6" fill="#19A88C"/>
  <text x="84" y="52" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="650" letter-spacing="-0.6"><tspan fill="#172A46">offsite</tspan><tspan fill="#19A88C">iq</tspan></text>
</svg>
